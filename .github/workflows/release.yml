name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          sh -n scripts/launch-firefox.sh
          sh -n scripts/build-firefox-appimage.sh
          sh -n firefox/appimage/AppRun

      - name: Python and JS checks
        run: |
          python3 -m py_compile scripts/tab-guard.py
          node tests/tab-guard-logic.mjs
          node tests/pointer-content.mjs
          python3 tests/status-log.py

      - name: Build AppImage
        run: sh scripts/build-firefox-appimage.sh

      - name: Checksums
        run: cd dist && sha256sum *.AppImage *.tar.gz > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
